<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reedsy Cattery prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=close1">
  <script>
    // Light mode only for this iteration (dark mode is parked); ?theme=dark still previews it
    const t = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
  </script>
</head>
<body>
  <!-- Faded Studio behind the cattery, so it reads as a modal inside Studio -->
  <div class="studio-backdrop" aria-hidden="true">
    <div class="rail"></div>
    <div class="panel"><span>Manuscript</span></div>
    <div class="page"></div>
  </div>

  <!-- Prototype control, not part of the design: back to the very start (Studio before adoption) -->
  <nav aria-label="Prototype controls"><a class="restart-proto" href="./"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>Restart Prototype</a></nav>

  <main id="app"></main>

  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="content.js?v=close1"></script>
  <script src="app.js?v=close1"></script>
</body>
</html>
